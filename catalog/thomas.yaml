# Draft of the plugin-catalog/thomas.yaml entry (not yet submitted to
# NousResearch/hermes-agent). Kept here so the reviewed pin sits next to the
# code it pins; the copy in plugin-catalog/ is the one that installs.
# `sha` still points at the last tagged release; re-pin it with
# `git rev-parse v<version>^{commit}` in the commit after tagging, never by hand.
name: thomas
repo: https://github.com/keppy/hermes-plugin-thomas
sha: b087cf158905e62b16c02e7bb1aa38691186ea6b
description: Fine-tune a small calibrated encoder classifier on Modal and rate it with gonogo.
  GPU launches through the thomas_encoder_train tool require human approval of a frozen data
  snapshot and config; direct Python/terminal/Modal launches are outside this hook. Data
  checks run locally for free. Training and CPU inference need the nonsecret THOMAS_PYTHON
  interpreter path in the Hermes process environment (not a credential required at install).
maintainer: keppy
tier: community
category: tools
requires_hermes: ">=0.21"
version: "0.1.2"
docs_url: https://github.com/keppy/hermes-plugin-thomas#readme
capabilities:
  provides_tools:
    - thomas_check_data
    - thomas_encoder_train
    - thomas_run_status
    - thomas_encoder_eval
  provides_hooks:
    - pre_tool_call
  provides_middleware: []
  requires_env: []
