name: thomas
version: 0.1.1
manifest_version: 2
api_version: 1
description: >-
  Fine-tune a small calibrated encoder classifier on Modal and rate it with
  gonogo, from inside a Hermes session. Every GPU launch stops at the human
  approval gate first; data checks and evaluation run locally for free.
author: James Dominguez (keppy)
license: MIT
homepage: https://github.com/keppy/hermes-plugin-thomas
tags: [training, fine-tuning, encoders, calibration, evals, modal]
provides_tools:
  - thomas_check_data
  - thomas_encoder_train
  - thomas_run_status
  - thomas_encoder_eval
provides_hooks:
  - pre_tool_call
